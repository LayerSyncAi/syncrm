<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    font-family: "Geist", "Segoe UI", sans-serif;
    background:
      radial-gradient(520px 380px at 88% 18%, rgba(155, 216, 61, 0.16), transparent 70%),
      radial-gradient(420px 320px at 8% 100%, rgba(155, 216, 61, 0.08), transparent 70%),
      #0f1419;
    color: #eef2f3;
    display: flex; align-items: center;
    padding: 0 72px;
    position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: linear-gradient(90deg, transparent 0%, #000 55%, #000 100%);
  }
  .left { position: relative; flex: 1; }
  .brand { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
  .brand img { height: 70px; }
  .brand span { font-size: 52px; font-weight: 600; letter-spacing: -1.5px; }
  h1 { font-size: 40px; font-weight: 600; line-height: 1.12; letter-spacing: -1px; max-width: 520px; }
  h1 em { font-style: normal; color: #9bd83d; }
  p { margin-top: 18px; font-size: 20px; color: rgba(238, 242, 243, 0.68); max-width: 480px; line-height: 1.4; }
  .chips { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 330px; }
  .chip {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px; padding: 16px 18px;
  }
  .chip b { display: block; font-size: 19px; font-weight: 600; color: #fff; }
  .chip i { display: block; font-style: normal; font-size: 14px; color: rgba(238,242,243,0.6); margin-top: 4px; }
  .chip::before { content: ""; display: block; width: 26px; height: 4px; border-radius: 2px; background: #9bd83d; margin-bottom: 12px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="left">
    <div class="brand"><img src="mark.svg" alt=""><span>SyncEstate</span></div>
    <h1>Your whole agency,<br><em>in your pocket.</em></h1>
    <p>Leads, lettings, valuations and finance on one login.</p>
  </div>
  <div class="chips">
    <div class="chip"><b>SynCRM</b><i>Leads and deals</i></div>
    <div class="chip"><b>SyncStay</b><i>Leases and rent</i></div>
    <div class="chip"><b>SyncWorth</b><i>Valuations</i></div>
    <div class="chip"><b>SyncFinance</b><i>Trust money</i></div>
  </div>
</body>
</html>
